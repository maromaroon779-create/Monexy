
name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Monexy-APK-project.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: cd monexy && npm install
      - run: cd monexy && npx cap add android
      - run: cd monexy && npx capacitor-assets generate --android
      - run: cd monexy && npx cap sync android
      - run: cd monexy/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Monexy-apk
          path: monexy/android/app/build/outputs/apk/debug/app-debug.apk
